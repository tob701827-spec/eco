<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTrack - Clasificación Inteligente de Residuos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TensorFlow.js y Teachable Machine Library -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-eco-dark text-slate-100 min-h-screen font-sans flex flex-col">

    <!-- Header / Navbar -->
    <header class="border-b border-emerald-900/40 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-sky-500 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-leaf text-slate-950 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 via-teal-300 to-sky-400 bg-clip-text text-transparent tracking-tight">EcoTrack</h1>
                    <p class="text-xs text-slate-400">IA para el Desarrollo Sostenible (ODS #12)</p>
                </div>
            </div>

            <!-- Gamification Badge Header -->
            <div class="flex items-center gap-3 bg-emerald-950/60 border border-emerald-500/30 px-4 py-2 rounded-full">
                <i class="fa-solid fa-coins text-amber-400 text-lg"></i>
                <div class="text-sm">
                    <span class="text-slate-400">Puntos Verdes:</span>
                    <span id="user-points" class="font-bold text-emerald-400 ml-1">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Panel: Scanner & Controls (7 cols) -->
        <section class="lg:col-span-7 space-y-6">
            <div class="glass-card p-6 rounded-2xl relative overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-semibold text-emerald-300 flex items-center gap-2">
                        <i class="fa-solid fa-camera"></i> Escáner Ecológico
                    </h2>
                    <span class="text-xs bg-sky-950 text-sky-300 px-2.5 py-1 rounded-full border border-sky-800">
                        Teachable Machine JS
                    </span>
                </div>

                <!-- Media Viewer / Camera Area -->
                <div id="media-container" class="relative w-full h-80 bg-slate-950 rounded-xl border-2 border-dashed border-emerald-800/50 flex flex-col items-center justify-center overflow-hidden transition-all duration-300">
                    
                    <!-- Placeholder UI -->
                    <div id="placeholder-ui" class="text-center p-6 space-y-3">
                        <div class="w-16 h-16 bg-emerald-900/30 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-2 border border-emerald-500/20">
                            <i class="fa-solid fa-cloud-arrow-up text-2xl"></i>
                        </div>
                        <p class="text-sm text-slate-300 font-medium">Activa tu cámara o sube una imagen del residuo</p>
                        <p class="text-xs text-slate-500">Admite botellas PET, cartón, vidrios y orgánicos</p>
                    </div>

                    <!-- Webcam Feed -->
                    <div id="webcam-container" class="hidden w-full h-full flex items-center justify-center"></div>

                    <!-- Uploaded Image Preview -->
                    <img id="image-preview" class="hidden w-full h-full object-contain" alt="Vista previa">
                </div>

                <!-- Input Action Buttons -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
                    <button id="btn-webcam" onclick="toggleWebcam()" class="btn-primary py-3 px-4 rounded-xl font-semibold flex items-center justify-center gap-2">
                        <i class="fa-solid fa-video"></i> Activar Cámara
                    </button>
                    
                    <label class="btn-secondary py-3 px-4 rounded-xl font-semibold flex items-center justify-center gap-2 cursor-pointer text-center">
                        <i class="fa-solid fa-file-arrow-up"></i> Subir Imagen
                        <input type="file" id="image-upload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>
                </div>

                <!-- Model URL Setup (Collapsible / Advanced) -->
                <div class="mt-6 pt-4 border-t border-slate-800/80">
                    <details class="text-xs text-slate-400">
                        <summary class="cursor-pointer hover:text-emerald-400 font-medium transition-colors">
                            <i class="fa-solid fa-gear mr-1"></i> Configurar Enlace de Teachable Machine
                        </summary>
                        <div class="mt-3 flex gap-2">
                            <input type="text" id="model-url" placeholder="https://teachablemachine.withgoogle.com/models/TU_MODELO/" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
                            <button onclick="loadCustomModel()" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold px-3 py-2 rounded-lg transition-colors whitespace-nowrap">
                                Cargar
                            </button>
                        </div>
                    </details>
                </div>
            </div>
        </section>

        <!-- Right Panel: Classification Results & Impact (5 cols
